<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="rd-token" content="__RD_TOKEN__">
  <link rel="icon" href="/icons/books.svg">
  <title>理性失序 · Rational Delirium</title>
  <link rel="stylesheet" href="/app.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header class="topbar">
    <a href="#view=overview" class="brand" aria-label="理性失序首页"><img src="/icons/books.svg" alt=""><strong>理性失序</strong><span>RATIONAL DELIRIUM</span></a>
    <nav aria-label="四个知识板块"><button data-view="case">案例<span>CASE</span></button><button data-view="evidence">证据<span>EVIDENCE</span></button><button data-view="hypothesis">假设<span>HYPOTHESIS</span></button><button data-view="loop">重复模式<span>LOOP</span></button></nav>
    <label class="search"><img src="/icons/magnifying-glass.svg" alt=""><input id="search" type="search" placeholder="搜索知识或 ID" aria-label="搜索知识或 ID" autocomplete="off"><kbd>⌘ / Ctrl K</kbd></label>
    <button class="icon-button history" data-view="history" aria-label="修订历史"><img src="/icons/clock-counter-clockwise.svg" alt=""></button>
    <button class="icon-button mobile-index" id="toggle-index" aria-label="展开索引" aria-controls="content-index" aria-expanded="false"><img src="/icons/sidebar.svg" alt=""></button>
  </header>
  <div id="connection" class="connection" role="status" hidden></div>
  <div class="workspace">
    <aside id="content-index" class="index" aria-label="内容索引"><div class="workspace-navigation"><nav class="browse-nav" aria-label="浏览知识"><button data-view="overview">知识总览</button><button data-view="library">全部资产</button><button data-view="inbox">待整理材料</button></nav><div class="capture-row"><button data-action="kb-capture" class="primary">收集材料</button><button class="icon-button" id="new-note" aria-label="新建笔记"><img src="/icons/plus.svg" alt=""></button></div></div><div class="index-heading"><h2 id="index-title">知识索引</h2><span id="index-count" class="small muted"></span></div><div id="index-list" aria-live="polite"></div><details class="manage-nav"><summary>管理与接入</summary><nav aria-label="管理知识库"><button data-view="proposals">Agent 提案</button><button data-view="history">修订历史</button><button data-action="kb-assets">导入 / 导出</button></nav></details><footer><span id="workspace-name">本地工作区</span><button class="icon-button" id="settings" aria-label="工作区与 Agent 接入"><img src="/icons/folder-open.svg" alt=""></button><button class="icon-button" id="refresh" aria-label="重新读取文件"><img src="/icons/arrow-clockwise.svg" alt=""></button></footer></aside>
    <main id="main" tabindex="-1"><div class="empty"><span class="eyebrow">RATIONAL DELIRIUM / ARCHIVE</span><h1>允许思想游移，<br>让依据留下。</h1><p>正在读取本地知识。</p></div></main>
    <aside id="source" class="source" aria-label="来源核对" tabindex="-1" hidden inert></aside>
  </div>
  <div id="toast" role="status" hidden></div>
  <dialog id="editor" aria-labelledby="editor-title"><form id="editor-form"><div class="dialog-heading"><h2 id="editor-title">编辑笔记</h2><button type="button" class="icon-button" id="close-editor" aria-label="关闭编辑"><img src="/icons/x.svg" alt=""></button></div><label>文件路径<input id="edit-path" required placeholder="Notes/新的笔记.md"></label><div id="new-fields"><label>标题<input id="edit-title" placeholder="新的想法"></label><label>类型<select id="edit-kind"><option value="note">普通笔记</option><option value="concept">概念</option><option value="hypothesis">假设</option><option value="observation">观察</option><option value="reference">参考</option><option value="process">流程</option><option value="decision">决定</option><option value="fact">事实声明</option></select></label></div><label class="editor-text">Markdown<textarea id="edit-markdown" spellcheck="false" required></textarea></label><p id="editor-message" role="status"></p><div class="dialog-actions"><button type="button" id="discard-editor" class="quiet">放弃本次草稿</button><button type="button" id="reload-editor" hidden>载入磁盘版本</button><button type="submit" class="primary">保存笔记</button></div></form></dialog>
  <dialog id="workspace-dialog" aria-labelledby="workspace-title"><div class="dialog-heading"><h2 id="workspace-title">工作区与 Agent 接入</h2><button class="icon-button" id="close-settings" aria-label="关闭工作区信息"><img src="/icons/x.svg" alt=""></button></div><div id="workspace-info"></div></dialog>
</body></html>
